<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Quorum</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--bg2:#1a2250;--card:#151c38;--line:rgba(255,255,255,.12);--fg:#f4f6ff;--muted:#9aa5c8;--accent:#6ea8ff;--good:#2ecc9a;--bad:#ff5d73}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
body{background:radial-gradient(900px 500px at 80% -10%,var(--bg2),transparent 60%),var(--bg);min-height:100vh;min-height:100dvh}
#app{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;padding:6px 2px 14px;font-size:14px;color:var(--muted)}
header .logo{font-weight:800;color:var(--fg);letter-spacing:-.02em}
header .sp{flex:1}
header .pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-weight:600;color:var(--fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
h1{font-size:32px;margin:0 0 6px;letter-spacing:-.03em}
h2.q{font-size:22px;line-height:1.25;margin:0 0 16px;letter-spacing:-.01em}
p.sub{color:var(--muted);margin:0 0 18px}
label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px;font-weight:600}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:#0d1330;border:1px solid var(--line);border-radius:12px;padding:13px 14px;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
#code{letter-spacing:.35em;text-transform:uppercase;font-weight:800;font-size:24px;text-align:center}
textarea{resize:none;min-height:96px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;font-size:16px;color:var(--fg);background:#26305f;cursor:pointer;margin-top:12px}
.btn.primary{background:var(--accent);color:#06122e}
.btn:disabled{opacity:.45;cursor:default}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:10px}
.note{color:var(--muted);font-size:14px;margin-top:12px;min-height:20px;text-align:center}
.note.ok{color:var(--good)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:#0d1330;color:var(--fg);font:inherit;font-weight:600;cursor:pointer}
.opt i{width:16px;height:16px;border-radius:50%;flex:none}
.opt.sel{border-color:var(--accent);background:#17225a}
.opt:disabled{opacity:.6}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:104px;border:0;border-radius:16px;color:#fff;font:inherit;font-weight:700;font-size:16px;padding:10px;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.25);transition:opacity .2s,transform .1s}
.tile:active{transform:scale(.97)}
.tile .sh{font-size:26px}
.tile.dim{opacity:.28}
.tile.mine{outline:4px solid #fff}
.tile.right{outline:4px solid var(--good);opacity:1}
.tile:disabled{cursor:default}
.timer{height:8px;background:#0d1330;border-radius:9px;overflow:hidden;margin-bottom:14px}
.timer b{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:#26305f;border-radius:99px;padding:6px 12px;font-weight:600;font-size:14px;max-width:100%;overflow-wrap:anywhere}
.row{display:flex;gap:8px}
.row input{flex:1}
.row .btn{width:auto;margin:0;padding:0 18px}
.scale{margin:18px 0}
.scale .st{font-weight:600;margin-bottom:8px}
.scale .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.scale .val{float:right;color:var(--accent);font-weight:800}
input[type=range]{padding:0;height:36px;background:none;border:0;accent-color:var(--accent)}
.rank{display:grid;gap:8px}
.rk{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#0d1330;border:1px solid var(--line);border-radius:12px;font-weight:600}
.rk .n{width:26px;height:26px;border-radius:50%;background:#26305f;display:grid;place-items:center;font-size:13px;flex:none}
.rk .t{flex:1;overflow-wrap:anywhere}
.rk button{border:0;background:#26305f;color:var(--fg);width:36px;height:36px;border-radius:10px;font-size:15px;cursor:pointer}
.rk button:disabled{opacity:.3}
.qs{display:grid;gap:8px;margin-top:16px}
.qi{display:flex;gap:12px;align-items:flex-start;background:#0d1330;border:1px solid var(--line);border-radius:12px;padding:12px}
.qi .tx{flex:1;overflow-wrap:anywhere}
.qi .up{border:0;background:#26305f;color:var(--fg);border-radius:10px;padding:6px 10px;font-weight:700;cursor:pointer;min-width:52px}
.qi .up.on{background:var(--accent);color:#06122e}
.big{font-size:56px;font-weight:800;letter-spacing:-.03em;text-align:center;margin:8px 0}
.center{text-align:center}
.lb{display:grid;gap:6px;margin-top:14px;text-align:left}
.lb div{display:flex;justify-content:space-between;background:#0d1330;border-radius:10px;padding:9px 12px;font-weight:600}
.lb .me{background:#17225a;border:1px solid var(--accent)}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid #26305f;border-top-color:var(--accent);animation:sp 1s linear infinite;margin:18px auto}
@keyframes sp{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
#updBar{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:12px;background:#1d2a55;border:1px solid var(--accent);padding:8px 8px 8px 16px;border-radius:99px;box-shadow:0 8px 30px rgba(0,0,0,.5);font-weight:600;font-size:14px;white-space:nowrap}
#updBar button{background:var(--accent);color:#06122e;border:0;border-radius:99px;padding:8px 14px;font:inherit;font-weight:700}
</style>
</head>
<body>
<div id="updBar" hidden><span>A new version is available.</span><button id="updBtn">Reload</button></div>
<div id="app">
  <header>
    <span class="logo">◆ Quorum</span><span class="sp"></span>
    <span class="pill" id="hName" hidden></span>
    <span class="pill" id="hScore" hidden></span>
  </header>

  <section id="vJoin" class="card">
    <h1>Join</h1>
    <p class="sub">Enter the code shown on the screen.</p>
    <label for="code">Code</label>
    <input id="code" maxlength="6" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="ABC123">
    <label for="name">Your name</label>
    <input id="name" maxlength="24" autocomplete="nickname" placeholder="Nickname">
    <button class="btn primary" id="btnJoin">Join</button>
    <div class="err" id="joinErr"></div>
  </section>

  <section id="vLive" hidden><div id="slide"></div></section>

  <section id="vMsg" class="card center" hidden>
    <h2 class="q" id="msgTitle"></h2>
    <p class="sub" id="msgBody"></p>
    <div class="spin" id="msgSpin"></div>
    <button class="btn" id="msgBtn" hidden>Join another session</button>
  </section>
</div>

<script type="module">
// Tell people when a new version has been published
(() => {
  const SELF = location.pathname + location.search;
  const hash = t => { let x = 2166136261; for (let i = 0; i < t.length; i++) { x ^= t.charCodeAt(i); x = Math.imul(x, 16777619); } return x >>> 0; };
  const grab = async mode => { const r = await fetch(SELF, { cache: mode }); if (!r.ok) throw new Error(r.status); return hash(await r.text()); };
  let base = null, shown = false;
  const check = async () => {
    if (shown) return;
    try { if (base === null) base = await grab('force-cache'); const now = await grab('no-store'); if (now !== base) { shown = true; const b = document.getElementById('updBar'); if (b) b.hidden = false; } } catch (e) { }
  };
  check(); setInterval(check, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
  window.addEventListener('focus', check);
  document.getElementById('updBtn')?.addEventListener('click', () => location.reload());
})();

let cfgMod = null;
try { cfgMod = await import('./firebase-config.js'); } catch (e) { /* handled below */ }
const CFG = cfgMod?.firebaseConfig || {};
const CONFIGURED = !!CFG.apiKey && !/PASTE|YOUR/i.test(CFG.apiKey + CFG.databaseURL);

const $ = (s, r = document) => r.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const toArr = v => Array.isArray(v) ? v : (v && typeof v === 'object' ? Object.values(v) : (v == null ? [] : [v]));
const PAL = ['#4f8cff', '#ff5d73', '#ffb02e', '#2ecc9a', '#a678ff', '#22c7e8', '#ff7ac6', '#9acd32'];
const QCOL = ['#e21b3c', '#1368ce', '#d89e00', '#26890c', '#864cbf', '#0aa3a3'];
const SHAPES = ['▲', '◆', '●', '■', '★', '⬟'];

const show = id => { for (const v of ['vJoin', 'vLive', 'vMsg']) $('#' + v).hidden = v !== id; };
function message(title, body, { spin = false, button = false } = {}) {
  $('#msgTitle').textContent = title; $('#msgBody').textContent = body || '';
  $('#msgSpin').hidden = !spin; $('#msgBtn').hidden = !button; show('vMsg');
}
$('#msgBtn').onclick = () => { location.href = location.pathname; };

if (!CONFIGURED) {
  message('Not configured', 'The host needs to add their Firebase details to firebase-config.js.');
  throw new Error('Quorum: firebase-config.js is not configured');
}

const FB = 'https://www.gstatic.com/firebasejs/10.14.1/';
const [A, Au, D] = await Promise.all([import(FB + 'firebase-app.js'), import(FB + 'firebase-auth.js'), import(FB + 'firebase-database.js')]);
const app = A.initializeApp(CFG), auth = Au.getAuth(app), db = D.getDatabase(app);
const P = p => D.ref(db, p);
let uid = null, code = '', offset = 0;
try {
  await auth.authStateReady?.();
  uid = auth.currentUser?.uid || (await Au.signInAnonymously(auth)).user.uid;
} catch (e) {
  message('Could not connect', 'Anonymous sign-in failed. The host should enable Anonymous authentication and authorise this domain in Firebase.');
  throw e;
}
D.onValue(P('.info/serverTimeOffset'), s => { offset = s.val() || 0; });
const serverNow = () => Date.now() + offset;

// ---------- join form ----------
const q = new URLSearchParams(location.search);
$('#code').value = (q.get('c') || localStorage.getItem('quorum.code') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
$('#name').value = localStorage.getItem('quorum.name') || '';
$('#code').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
for (const id of ['code', 'name']) $('#' + id).addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnJoin').click(); });
show('vJoin');
(q.get('c') ? $('#name') : $('#code')).focus();

$('#btnJoin').onclick = async () => {
  const c = $('#code').value.trim().toUpperCase(), n = $('#name').value.trim().slice(0, 24);
  const err = $('#joinErr'); err.textContent = '';
  if (c.length !== 6) { err.textContent = 'The code has 6 characters.'; return; }
  if (!n) { err.textContent = 'Please enter a name.'; return; }
  $('#btnJoin').disabled = true;
  try {
    const owner = (await D.get(P(`sessions/${c}/owner`))).val();
    if (!owner) { err.textContent = 'Session not found. Check the code.'; return; }
    await D.set(P(`sessions/${c}/participants/${uid}`), { name: n, joinedAt: D.serverTimestamp() });
    localStorage.setItem('quorum.name', n); localStorage.setItem('quorum.code', c);
    code = c; $('#hName').textContent = n; $('#hName').hidden = false;
    history.replaceState(null, '', `${location.pathname}?c=${c}`);
    start();
  } catch (e) { err.textContent = 'Could not join: ' + (e.message || e); }
  finally { $('#btnJoin').disabled = false; }
};

// ---------- live session ----------
let ST = null, MINE = {}, ALL = {}, VOTES = {}, SCORES = {}, view = null, viewKey = '', slideUnsubs = [];

function start() {
  message('Connected', 'Waiting for the presenter…', { spin: true });
  D.onValue(P(`sessions/${code}/owner`), s => { if (s.val() === null) message('Session ended', 'Thanks for joining.', { button: true }); });
  D.onValue(P(`sessions/${code}/scores`), s => { SCORES = s.val() || {}; const me = SCORES[uid]; $('#hScore').hidden = !me; if (me) $('#hScore').textContent = me.score + ' pts'; view?.update?.(); });
  D.onValue(P(`sessions/${code}/state`), s => { ST = s.val(); onState(); });
}

function teardown() { slideUnsubs.forEach(f => f()); slideUnsubs = []; view?.stop?.(); view = null; MINE = {}; ALL = {}; VOTES = {}; }

function onState() {
  if (!ST || !ST.slide) { if (viewKey) { teardown(); viewKey = ''; } message('Waiting for the presenter…', 'Your screen will update automatically.', { spin: true }); return; }
  const key = ST.slideId + ':' + ST.ver;
  if (key !== viewKey) {
    teardown(); viewKey = key; show('vLive');
    const sid = ST.slideId;
    if (ST.slide.type === 'qa') {
      slideUnsubs.push(D.onValue(P(`sessions/${code}/responses/${sid}`), s => { ALL = s.val() || {}; MINE = ALL[uid] || {}; view?.update?.(); }));
      slideUnsubs.push(D.onValue(P(`sessions/${code}/votes/${sid}`), s => { VOTES = s.val() || {}; view?.update?.(); }));
    } else {
      slideUnsubs.push(D.onValue(P(`sessions/${code}/responses/${sid}/${uid}`), s => { MINE = s.val() || {}; view?.update?.(); }));
    }
    view = build();
  }
  view?.update?.();
}

const canAnswer = () => ST && ST.open === true;
async function put(rid, obj) {
  try { await D.set(P(`sessions/${code}/responses/${ST.slideId}/${uid}/${rid}`), { ...obj, t: D.serverTimestamp() }); return true; }
  catch (e) { setNote("Couldn't send. Voting may have closed.", false); return false; }
}
async function putNew(obj) {
  try { const r = D.push(P(`sessions/${code}/responses/${ST.slideId}/${uid}`)); await D.set(r, { ...obj, t: D.serverTimestamp() }); return true; }
  catch (e) { setNote("Couldn't send. Voting may have closed.", false); return false; }
}
let noteEl = null;
function setNote(t, ok) { if (noteEl) { noteEl.textContent = t; noteEl.className = 'note' + (ok ? ' ok' : ''); } }
const mineList = () => Object.values(MINE).filter(x => x && x.v !== undefined).sort((a, b) => (a.t || 0) - (b.t || 0));

function build() {
  const s = ST.slide, root = $('#slide'); root.innerHTML = '';
  const card = el('div', 'card'); root.append(card);
  const h = el('h2', 'q'); h.textContent = s.title || ''; card.append(h);
  const body = el('div'); card.append(body);
  noteEl = el('div', 'note'); card.append(noteEl);
  const fn = builders[s.type] || builders.info;
  return fn(s, body);
}

const builders = {
  info(s, body) {
    body.innerHTML = '<div class="big">👀</div><p class="sub center">Eyes on the main screen.</p>';
    return { update() { } };
  },

  mc(s, body) {
    let sel = new Set(), touched = false;
    const list = el('div', 'opts'); body.append(list);
    const btns = s.options.map((txt, i) => {
      const b = el('button', 'opt', `<i style="background:${PAL[i % 8]}"></i><span></span>`); b.lastChild.textContent = txt;
      b.onclick = () => {
        if (!canAnswer()) return; touched = true;
        if (s.multi) { if (sel.has(i)) sel.delete(i); else if (sel.size < (s.max || 1)) sel.add(i); } else sel = new Set([i]);
        paint();
      };
      list.append(b); return b;
    });
    const send = el('button', 'btn primary', 'Submit'); body.append(send);
    send.onclick = async () => { if (!sel.size) return; if (await put('a', { v: [...sel] })) setNote('Answer sent ✓', true); };
    if (s.multi) body.insertBefore(el('p', 'sub', `Choose up to ${s.max || 1}.`), list);
    function paint() {
      btns.forEach((b, i) => { b.classList.toggle('sel', sel.has(i)); b.disabled = !canAnswer(); });
      send.disabled = !canAnswer() || !sel.size; send.textContent = MINE.a ? 'Update answer' : 'Submit';
    }
    return {
      update() {
        if (MINE.a && !touched) sel = new Set(toArr(MINE.a.v));
        paint();
        if (!canAnswer()) setNote('Voting is closed.', false); else if (MINE.a) setNote('Answer sent ✓', true); else setNote('', false);
      }
    };
  },

  quiz(s, body) {
    const timer = el('div', 'timer', '<b></b>'); body.append(timer);
    const grid = el('div', 'tiles'); body.append(grid);
    const tiles = s.options.map((txt, i) => {
      const b = el('button', 'tile', `<span class="sh">${SHAPES[i % 6]}</span><span></span>`);
      b.style.background = QCOL[i % 6]; b.lastChild.textContent = txt;
      b.onclick = async () => { if (!canAnswer() || MINE.a) return; if (await put('a', { v: i })) update(); };
      grid.append(b); return b;
    });
    const bar = timer.firstChild;
    const tick = () => {
      if (ST.phase !== 'open' || !ST.startedAt || !ST.limit) { bar.style.transform = ST.phase === 'ready' ? 'scaleX(1)' : 'scaleX(0)'; return; }
      const f = Math.max(0, 1 - (serverNow() - ST.startedAt) / (ST.limit * 1000)); bar.style.transform = `scaleX(${f})`;
    };
    const iv = setInterval(tick, 100);
    function update() {
      const ph = ST.phase, mine = MINE.a ? +MINE.a.v : null, correct = toArr(ST.reveal?.correct).map(Number);
      tiles.forEach((b, i) => {
        b.disabled = !(ph === 'open' && mine === null);
        b.classList.toggle('mine', mine === i && ph !== 'revealed');
        b.classList.toggle('dim', (ph === 'revealed' && !correct.includes(i)) || (mine !== null && mine !== i && ph !== 'revealed'));
        b.classList.toggle('right', ph === 'revealed' && correct.includes(i));
      });
      if (ph === 'ready') setNote('Get ready… look at the screen.', false);
      else if (ph === 'open') setNote(mine !== null ? 'Locked in! Waiting for the others…' : 'Pick an answer, quickly!', mine !== null);
      else if (ph === 'closed') setNote(mine !== null ? 'Answer locked in. Waiting for the result…' : "Time's up.", false);
      else if (ph === 'revealed') {
        if (mine === null) setNote('You did not answer this one.', false);
        else if (correct.includes(mine)) {
          const el_ = Math.max(0, (MINE.a.t || ST.startedAt) - (ST.startedAt || 0));
          const f = ST.limit ? Math.min(1, el_ / (ST.limit * 1000)) : 0;
          setNote(`Correct! +${Math.round(1000 * (1 - f / 2))} points`, true);
        } else setNote('Not this time.', false);
      }
      tick();
    }
    return { update, stop() { clearInterval(iv); } };
  },

  cloud(s, body) { return textEntry(s, body, false); },
  open(s, body) { return textEntry(s, body, true); },

  scale(s, body) {
    const min = +s.min || 1, max = +s.max || 5, st = s.statements || [];
    let vals = st.map(() => Math.round((min + max) / 2)), touched = false;
    const outs = [], ranges = [];
    st.forEach((txt, i) => {
      const w = el('div', 'scale', `<div class="st"><span class="val"></span><span class="t"></span></div><input type="range" min="${min}" max="${max}" step="1" value="${vals[i]}"><div class="lbl"><span></span><span></span></div>`);
      w.querySelector('.t').textContent = txt; const [a, b] = w.querySelectorAll('.lbl span'); a.textContent = s.minLabel || min; b.textContent = s.maxLabel || max;
      const r = w.querySelector('input'); r.oninput = () => { touched = true; vals[i] = +r.value; paint(); };
      outs.push(w.querySelector('.val')); ranges.push(r); body.append(w);
    });
    const send = el('button', 'btn primary', 'Submit'); body.append(send);
    send.onclick = async () => { if (await put('a', { v: vals })) setNote('Answer sent ✓', true); };
    function paint() { outs.forEach((o, i) => { o.textContent = vals[i]; ranges[i].disabled = !canAnswer(); }); send.disabled = !canAnswer(); send.textContent = MINE.a ? 'Update answer' : 'Submit'; }
    return {
      update() {
        if (MINE.a && !touched) { vals = toArr(MINE.a.v).map(Number); ranges.forEach((r, i) => { r.value = vals[i]; }); }
        paint(); if (!canAnswer()) setNote('Voting is closed.', false); else if (MINE.a) setNote('Answer sent ✓', true); else setNote('', false);
      }
    };
  },

  rank(s, body) {
    let order = s.options.map((_, i) => i), touched = false;
    body.append(el('p', 'sub', 'Put your favourite first.'));
    const list = el('div', 'rank'); body.append(list);
    const send = el('button', 'btn primary', 'Submit'); body.append(send);
    send.onclick = async () => { if (await put('a', { v: order })) setNote('Answer sent ✓', true); };
    function paint() {
      list.innerHTML = '';
      order.forEach((oi, pos) => {
        const r = el('div', 'rk', `<span class="n">${pos + 1}</span><span class="t"></span><button>▲</button><button>▼</button>`);
        r.querySelector('.t').textContent = s.options[oi];
        const [up, dn] = r.querySelectorAll('button'); up.disabled = pos === 0 || !canAnswer(); dn.disabled = pos === order.length - 1 || !canAnswer();
        const swap = d => { touched = true;[order[pos], order[pos + d]] = [order[pos + d], order[pos]]; paint(); };
        up.onclick = () => swap(-1); dn.onclick = () => swap(1); list.append(r);
      });
      send.disabled = !canAnswer(); send.textContent = MINE.a ? 'Update ranking' : 'Submit';
    }
    return {
      update() {
        if (MINE.a && !touched) { const o = toArr(MINE.a.v).map(Number); if (o.length === s.options.length) order = o; }
        paint(); if (!canAnswer()) setNote('Voting is closed.', false); else if (MINE.a) setNote('Answer sent ✓', true); else setNote('', false);
      }
    };
  },

  qa(s, body) {
    const ta = el('textarea'); ta.maxLength = 200; ta.placeholder = 'Type your question…'; body.append(ta);
    const send = el('button', 'btn primary', 'Send question'); body.append(send);
    const list = el('div', 'qs'); body.append(list);
    send.onclick = async () => { const v = ta.value.trim(); if (!v) return; if (await putNew({ v })) { ta.value = ''; setNote('Question sent ✓', true); } };
    async function vote(qid, on) {
      try { if (on) await D.remove(P(`sessions/${code}/votes/${ST.slideId}/${qid}/${uid}`)); else await D.set(P(`sessions/${code}/votes/${ST.slideId}/${qid}/${uid}`), true); } catch (e) { }
    }
    return {
      update() {
        ta.disabled = send.disabled = !canAnswer();
        const items = [];
        for (const [u, rs] of Object.entries(ALL)) for (const [rid, x] of Object.entries(rs || {})) if (x && x.v) items.push({ qid: u + '__' + rid, text: String(x.v), t: x.t || 0, n: Object.keys(VOTES[u + '__' + rid] || {}).length, mine: !!(VOTES[u + '__' + rid] || {})[uid] });
        items.sort((a, b) => b.n - a.n || b.t - a.t);
        list.innerHTML = '';
        items.slice(0, 40).forEach(it => {
          const r = el('div', 'qi', '<div class="tx"></div><button class="up"></button>'); r.firstChild.textContent = it.text;
          const b = r.lastChild; b.textContent = '▲ ' + it.n; b.classList.toggle('on', it.mine); b.onclick = () => vote(it.qid, it.mine); list.append(r);
        });
        if (!canAnswer()) setNote('Questions are closed.', false);
      }
    };
  },

  leaderboard(s, body) {
    const box = el('div', 'center'); body.append(box);
    return {
      update() {
        const list = Object.entries(SCORES).map(([u, x]) => ({ u, name: x.name, score: x.score })).sort((a, b) => b.score - a.score);
        const i = list.findIndex(x => x.u === uid);
        box.innerHTML = '';
        if (i < 0) { box.innerHTML = '<p class="sub">No scores yet. Answer the quiz questions to earn points.</p>'; return; }
        box.append(el('div', 'big', '#' + (i + 1)), el('p', 'sub', `${list[i].score} points`));
        const lb = el('div', 'lb');
        list.slice(0, 5).forEach((x, k) => { const r = el('div', x.u === uid ? 'me' : '', '<span></span><span></span>'); r.firstChild.textContent = `${k + 1}. ${x.name}`; r.lastChild.textContent = x.score; lb.append(r); });
        box.append(lb);
      }
    };
  }
};

function textEntry(s, body, multiline) {
  const max = +s.max || (multiline ? 2 : 3);
  const field = multiline ? el('textarea') : el('input');
  field.maxLength = multiline ? 200 : 30; field.placeholder = multiline ? 'Type your answer…' : 'Type a word or short phrase…';
  const send = el('button', multiline ? 'btn primary' : 'btn primary', multiline ? 'Send' : 'Add');
  if (multiline) { body.append(field, send); } else { const r = el('div', 'row'); r.append(field, send); send.style.marginTop = '0'; body.append(r); }
  const chips = el('div', 'chips'); body.append(chips);
  const submit = async () => { const v = field.value.trim(); if (!v || !canAnswer() || mineList().length >= max) return; field.value = ''; if (await putNew({ v })) setNote('Sent ✓', true); };
  send.onclick = submit; if (!multiline) field.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  return {
    update() {
      const mine = mineList(), left = max - mine.length;
      field.disabled = send.disabled = !canAnswer() || left <= 0;
      chips.innerHTML = ''; mine.forEach(m => { const c = el('span', 'chip'); c.textContent = String(m.v); chips.append(c); });
      if (!canAnswer()) setNote('Voting is closed.', false); else if (left <= 0) setNote('All done. Thank you!', true); else setNote(`${left} more allowed`, false);
    }
  };
}
</script>
